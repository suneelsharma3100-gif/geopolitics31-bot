name: Geopolitics31 News Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python geopolitics31_oneshot.py

      - name: Commit seen URLs back
        run: |
          git config user.name "Geopolitics31 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_urls.json
          git commit -m "Update seen URLs [skip ci]" || echo "No changes to commit"
          git push
